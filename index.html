<body>
<div class="topbar">
  <div class="row">
    <span class="grow" id="growIcon" aria-hidden="true"></span>
    <h1 id="title"></h1>
    <button class="iconbtn" id="btnMenu" aria-label="เมนู">☰</button>
  </div>
  <div class="camppill" id="campPill"></div>
  <div class="dots" id="dots"></div>
</div>
<main id="main"></main>
<div class="bottombar">
  <button class="btn back" id="btnBack">← ย้อน</button>
  <button class="btn" id="btnNext">ถัดไป →</button>
</div>

<!-- เมนู -->
<div class="overlay" id="ovMenu"><div class="sheet">
  <h2><span>เมนู</span><button class="del" data-close aria-label="ปิด">✕</button></h2>
  <div class="field"><label>ชื่อลูกค้า</label><input class="txt" id="clientName" placeholder="เช่น คุณสมชาย"></div>
  <div class="field"><label>ชื่อตัวแทน (แสดงในรายงาน)</label><input class="txt" id="agentName" placeholder="เช่น อภิชา"></div>
  <div class="field"><label>เลขใบอนุญาตตัวแทน (แสดงในรายงาน)</label><input class="txt" id="agentLic" placeholder="เลขที่ใบอนุญาต"></div>
  <button class="menuitem" id="mSave"><span class="ic">💾</span>บันทึกแผนของลูกค้าคนนี้</button>
  <button class="menuitem" id="mOpen"><span class="ic">📂</span>เปิดแผนลูกค้าที่บันทึกไว้</button>
  <button class="menuitem" id="mNew"><span class="ic">➕</span>เริ่มแผนใหม่ (ลูกค้าคนใหม่)</button>
  <button class="menuitem" id="mTvm"><span class="ic">🧮</span>เครื่องคิดเลขเงินออม–เงินกู้</button>
  <button class="menuitem" id="mBig"><span class="ic">⭐</span><span id="mBigT">ตัวอักษรใหญ่ขึ้น</span></button>
  <button class="menuitem" id="mHints"><span class="ic">💬</span><span id="mHintsT">ซ่อนคำอธิบายใต้ช่อง</span></button>
  <button class="menuitem" id="mAssume"><span class="ic">⚙️</span>ตัวเลขตั้งต้นที่ใช้คำนวณ (เงินเฟ้อ เงินสำรอง ผลตอบแทน)</button>
  <button class="menuitem" id="mBackup"><span class="ic">⬇</span>สำรองแผนทั้งหมดเป็นไฟล์ (ไว้ย้ายเครื่อง / กู้คืน)</button>
  <button class="menuitem" id="mImport"><span class="ic">📂</span>นำเข้าแผนจากไฟล์สำรอง</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button class="menuitem" id="mShare"><span class="ic">📤</span>ส่งแผนให้ลูกค้า (รูปภาพ / PDF / ข้อความ)</button>
</div></div>
<div class="overlay" id="ovClients"><div class="sheet">
  <h2><span>แผนที่บันทึกไว้</span><button class="del" data-close aria-label="ปิด">✕</button></h2>
  <div id="clientList"></div>
</div></div>
<div class="overlay" id="ovAssume"><div class="sheet">
  <h2><span>ตัวเลขตั้งต้นที่ใช้คำนวณ</span><button class="del" data-close aria-label="ปิด">✕</button></h2>
  <div id="assumeBody"></div>
</div></div>
<!-- เครื่องคิดเลขเงินออม–เงินกู้ -->
<div class="overlay" id="ovTvm"><div class="sheet">
  <h2><span>🧮 เครื่องคิดเลขเงินออม–เงินกู้</span><button class="del" data-close aria-label="ปิด">✕</button></h2>
  <p class="hint">กรอกตัวเลขที่รู้ แล้วกด “หา” ที่ช่องที่อยากรู้ ใส่ตัวเลขเป็นบวกทั้งหมด คิดแบบทบต้น</p>
  <div class="seg" id="tvmMode"><button data-v="save" class="on">ออม / ลงทุน</button><button data-v="loan">กู้ / ผ่อน</button></div>
  <div class="tvmrow"><label id="lbPV">เงินก้อนตั้งต้น</label><input id="tPV" inputmode="decimal" value="1,000,000"><button class="btn sm" data-solve="PV">หา</button></div>
  <div class="tvmrow"><label id="lbPMT">เงินออมต่องวด</label><input id="tPMT" inputmode="decimal" value="0"><button class="btn sm" data-solve="PMT">หา</button></div>
  <div class="tvmrow"><label id="lbFV">เงินที่จะได้ปลายทาง</label><input id="tFV" inputmode="decimal"><button class="btn sm" data-solve="FV">หา</button></div>
  <div class="tvmrow"><label>ผลตอบแทน / ดอกเบี้ย ต่อปี (%) <button class="pm" id="tRateSign" type="button" aria-label="สลับบวกลบ">± สลับบวก/ลบ</button></label><input id="tRate" inputmode="decimal" value="-3"><button class="btn sm" data-solve="Rate">หา</button></div>
  <div class="tvmrow"><label>จำนวนงวด</label><input id="tN" inputmode="decimal" value="5"><button class="btn sm" data-solve="N">หา</button></div>
  <div class="field"><label>งวดละ</label><select id="tPPY"><option value="1">ปี</option><option value="12">เดือน</option></select></div>
  <div class="seg" id="tvmType"><button data-v="0" class="on">จ่ายปลายงวด</button><button data-v="1">จ่ายต้นงวด</button></div>
  <div id="tvmSay"></div>
</div></div>
<div class="overlay" id="ovExport"><div class="sheet">
  <h2><span>ส่งแผนให้ลูกค้า</span><button class="del" data-close aria-label="ปิด">✕</button></h2>
  <div class="seg" id="repMode"><button data-v="short" class="on">ฉบับย่อ 2 หน้า</button><button data-v="full">ฉบับเต็ม</button></div>
  <p class="hint" id="expMsg">กำลังสร้างรายงาน…</p>
  <div class="expprev" id="expPrev"></div>
  <div class="explabel">📤 ส่งต่อ (ไลน์ อีเมล ฯลฯ)</div>
  <div class="grid3">
    <button class="btn" id="expImg">🖼️ รูปภาพ</button>
    <button class="btn" id="expPdf">📄 PDF</button>
    <button class="btn ghost" id="expTxt">💬 ข้อความ</button>
  </div>
  <div class="explabel">⬇️ เก็บไฟล์ไว้ในเครื่อง</div>
  <div class="grid2b">
    <button class="btn ghost" id="savePdf">⬇️ PDF</button>
    <button class="btn ghost" id="saveImg">⬇️ รูปภาพ</button>
  </div>
  <p class="hint" id="saveHint" style="margin-top:8px"></p>
</div></div>
